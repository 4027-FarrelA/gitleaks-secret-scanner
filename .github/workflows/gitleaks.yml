name: Gitleaks Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          mkdir -p gitleaks
          cd gitleaks
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the current commit with Gitleaks
        run: |
          snapshot="$(mktemp -d "$RUNNER_TEMP/gitleaks-snapshot.XXXXXX")"
          git archive HEAD | tar -x -C "$snapshot"
          cd "$snapshot"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --config .gitleaks.toml \
            --no-banner --redact=100 --verbose .
